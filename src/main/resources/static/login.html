<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker - Login</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-shell">
<div class="section auth-card">
    <h1><span class="coin-mark" style="display:inline-flex;vertical-align:middle;margin-right:8px;">CT</span>Coin Tracker</h1>
    <p class="subtitle">Welcome back — log in to your collection.</p>
    <form id="loginForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="primary">Log in</button>
    </form>
    <div id="status" class="status"></div>
    <div class="auth-links">
        No account? <a href="register.html">Register</a>
    </div>
</div>
</div>

<script src="js/auth.js"></script>
<script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");

    // Loading this page through the filter chain seeds the XSRF-TOKEN cookie,
    // so the login POST below can send the matching header.

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Logging in...";
        status.className = "status";

        try {
            // On success the server has already set the session cookie (see
            // AuthController#login) — no token to store client-side, just navigate on.
            await CoinAuth.fetchJson("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            window.location.href = "index.html";
        } catch (error) {
            status.textContent = error.message;
            status.className = "status error";
        }
    });
</script>
</body>
</html>
