<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker - Admin</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
<div class="section topbar">
    <div class="brand">
        <span class="coin-mark">CT</span>
        <h1>Coin Tracker &middot; Admin</h1>
    </div>
    <div class="row" style="margin-bottom: 0;">
        <span class="identity" id="identity"></span>
        <a href="index.html">My collection</a>
        <button id="logoutButton">Log out</button>
    </div>
</div>

<div class="section">
    <h2>Users</h2>
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</div>

<div class="section">
    <h2>Coin Catalog</h2>
    <form id="coinForm" class="filter-bar">
        <input type="hidden" id="coinId">
        <input type="text" id="coinCountry" placeholder="Country" required>
        <input type="text" id="coinDenomination" placeholder="Denomination" required>
        <input type="number" id="coinYear" placeholder="Year" min="1" max="2999" required class="small-input">
        <button type="submit" class="primary" id="coinSubmitButton">Add coin</button>
        <button type="button" id="coinCancelButton" style="display: none;">Cancel</button>
    </form>
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Denomination</th>
                <th>Year</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="coinsTableBody"></tbody>
        </table>
    </div>
</div>

<div class="section">
    <h2>Audit Trail</h2>
    <p>Privileged changes, most recent first. This record is read-only.</p>
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>When</th>
                <th>Admin</th>
                <th>Action</th>
                <th>Target</th>
                <th>Details</th>
            </tr>
            </thead>
            <tbody id="auditTableBody"></tbody>
        </table>
    </div>
    <div id="auditEmptyState" class="empty-state" style="display: none;">No admin actions recorded yet.</div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
    const identity = document.getElementById("identity");
    const usersTableBody = document.getElementById("usersTableBody");
    const coinsTableBody = document.getElementById("coinsTableBody");
    const coinForm = document.getElementById("coinForm");
    const coinIdInput = document.getElementById("coinId");
    const coinCountryInput = document.getElementById("coinCountry");
    const coinDenominationInput = document.getElementById("coinDenomination");
    const coinYearInput = document.getElementById("coinYear");
    const coinSubmitButton = document.getElementById("coinSubmitButton");
    const coinCancelButton = document.getElementById("coinCancelButton");
    const auditTableBody = document.getElementById("auditTableBody");
    const auditEmptyState = document.getElementById("auditEmptyState");

    document.getElementById("logoutButton").addEventListener("click", () => CoinAuth.logout());

    function handleError(error) {
        if (error.status === 401) {
            CoinAuth.redirectToLogin();
            return;
        }
        CoinUI.error(error.message);
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value);
        return div.innerHTML;
    }

    async function loadUsers() {
        const users = await CoinAuth.fetchJson("/api/admin/users");
        usersTableBody.innerHTML = "";

        users.forEach(user => {
            // Only USER<->ADMIN toggle offered (no role picker) since those are the only two
            // UserRole values. No client-side check preventing an admin from demoting/
            // deactivating themselves or the last remaining admin — that guard lives entirely
            // server-side in UserManagementService, which rejects the request with a 400 if
            // it would strand the app with zero active admins. The confirm() dialogs below are
            // just a UX guardrail against misclicks, not a security control.
            const nextRole = user.role === "ADMIN" ? "USER" : "ADMIN";
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${user.userId}</td>
                <td>${escapeHtml(user.username)}</td>
                <td><span class="badge ${user.role === "ADMIN" ? "badge-admin" : "badge-user"}">${user.role}</span></td>
                <td><span class="badge ${user.active ? "badge-owned" : "badge-inactive"}">${user.active ? "Active" : "Inactive"}</span></td>
                <td>
                    <button data-action="role" data-id="${user.userId}" data-value="${nextRole}">Make ${nextRole}</button>
                    <button class="danger" data-action="active" data-id="${user.userId}" data-value="${!user.active}">${user.active ? "Deactivate" : "Activate"}</button>
                </td>
            `;

            row.querySelector('[data-action="role"]')
                .addEventListener("click", () => {
                    if (nextRole === "USER" && !confirm(`Demote "${user.username}" from ADMIN to USER?`)) {
                        return;
                    }
                    updateRole(user.userId, nextRole);
                });
            row.querySelector('[data-action="active"]')
                .addEventListener("click", () => {
                    if (user.active && !confirm(`Deactivate "${user.username}"? They will be signed out on their next request.`)) {
                        return;
                    }
                    updateActive(user.userId, !user.active);
                });

            usersTableBody.appendChild(row);
        });
    }

    async function updateRole(userId, role) {
        try {
            await CoinAuth.fetchJson(`/api/admin/users/${userId}/role`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ role })
            });
            CoinUI.success(`Updated role for user ${userId} to ${role}.`);
            await Promise.all([loadUsers(), loadAuditTrail()]);
        } catch (error) {
            handleError(error);
        }
    }

    async function updateActive(userId, active) {
        try {
            await CoinAuth.fetchJson(`/api/admin/users/${userId}/active`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ active })
            });
            CoinUI.success(`${active ? "Activated" : "Deactivated"} user ${userId}.`);
            await Promise.all([loadUsers(), loadAuditTrail()]);
        } catch (error) {
            handleError(error);
        }
    }

    // Catalog reads go through the shared GET /api/coins (any authenticated user); only the
    // writes below are admin-gated, so there's no admin-specific list endpoint to call.
    async function loadCoins() {
        const coins = await CoinAuth.fetchJson("/api/coins");
        coinsTableBody.innerHTML = "";

        coins.forEach(coin => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${coin.coinId}</td>
                <td>${escapeHtml(coin.country)}</td>
                <td>${escapeHtml(coin.denomination)}</td>
                <td>${coin.year}</td>
                <td>
                    <button data-action="edit">Edit</button>
                    <button class="danger" data-action="delete">Delete</button>
                </td>
            `;

            row.querySelector('[data-action="edit"]')
                .addEventListener("click", () => startEditingCoin(coin));
            row.querySelector('[data-action="delete"]')
                .addEventListener("click", () => deleteCoin(coin));

            coinsTableBody.appendChild(row);
        });
    }

    function startEditingCoin(coin) {
        coinIdInput.value = coin.coinId;
        coinCountryInput.value = coin.country;
        coinDenominationInput.value = coin.denomination;
        coinYearInput.value = coin.year;
        coinSubmitButton.textContent = "Save changes";
        coinCancelButton.style.display = "";
        coinCountryInput.focus();
    }

    function resetCoinForm() {
        coinForm.reset();
        coinIdInput.value = "";
        coinSubmitButton.textContent = "Add coin";
        coinCancelButton.style.display = "none";
    }

    async function submitCoinForm(event) {
        event.preventDefault();

        const editingId = coinIdInput.value;
        const body = JSON.stringify({
            country: coinCountryInput.value,
            denomination: coinDenominationInput.value,
            year: Number(coinYearInput.value)
        });

        try {
            await CoinAuth.fetchJson(
                editingId ? `/api/admin/coins/${editingId}` : "/api/admin/coins",
                {
                    method: editingId ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body
                }
            );

            CoinUI.success(editingId ? `Updated coin ${editingId}.` : "Coin added.");
            resetCoinForm();
            await Promise.all([loadCoins(), loadAuditTrail()]);
        } catch (error) {
            handleError(error);
        }
    }

    // Two-step delete: the first attempt goes without ?force, so the server answers with how
    // many collection entries would cascade away. Only then do we ask the admin to confirm
    // destroying other users' data — the count comes from the server rather than being guessed
    // here, so the number in the prompt is the one that will actually be deleted.
    async function deleteCoin(coin) {
        const label = `${coin.country} ${coin.denomination} (${coin.year})`;

        try {
            await CoinAuth.fetchJson(`/api/admin/coins/${coin.coinId}`, { method: "DELETE" });
            CoinUI.success(`Deleted ${label}.`);
            await Promise.all([loadCoins(), loadAuditTrail()]);
            return;
        } catch (error) {
            if (error.status !== 400) {
                handleError(error);
                return;
            }

            if (!confirm(`${error.message}\n\nDelete ${label}?`)) {
                return;
            }
        }

        try {
            await CoinAuth.fetchJson(`/api/admin/coins/${coin.coinId}?force=true`, { method: "DELETE" });
            CoinUI.success(`Deleted ${label}.`);
            await Promise.all([loadCoins(), loadAuditTrail()]);
        } catch (error) {
            handleError(error);
        }
    }

    // Server sends a LocalDateTime as an ISO-8601 string with no zone. Rendering it via the
    // browser's locale keeps it readable without pretending we know the server's timezone.
    function formatTimestamp(value) {
        if (!value) {
            return "";
        }

        const parsed = new Date(value);
        return isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
    }

    // Underscored enum names (USER_ROLE_CHANGED) are the storage format, not something to show
    // an admin — this turns them into "User role changed".
    function formatAction(action) {
        const words = String(action).toLowerCase().replace(/_/g, " ");
        return words.charAt(0).toUpperCase() + words.slice(1);
    }

    async function loadAuditTrail() {
        const actions = await CoinAuth.fetchJson("/api/admin/audit");
        auditTableBody.innerHTML = "";

        actions.forEach(entry => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${escapeHtml(formatTimestamp(entry.createdAt))}</td>
                <td>${escapeHtml(entry.actorUsername)}</td>
                <td>${escapeHtml(formatAction(entry.action))}</td>
                <td>${escapeHtml(entry.targetType)}${entry.targetId == null ? "" : " #" + entry.targetId}</td>
                <td>${escapeHtml(entry.details || "")}</td>
            `;
            auditTableBody.appendChild(row);
        });

        auditEmptyState.style.display = actions.length === 0 ? "" : "none";
    }

    coinForm.addEventListener("submit", submitCoinForm);
    coinCancelButton.addEventListener("click", resetCoinForm);

    async function initializePage() {
        let me;
        try {
            me = await CoinAuth.getMe();
        } catch (error) {
            CoinAuth.redirectToLogin();
            return;
        }

        // Client-side gate only, same as index.html's admin-link toggle — the server's
        // class-level @PreAuthorize("hasRole('ADMIN')") on AdminUserController is what
        // actually stops a non-admin from calling these endpoints directly.
        if (me.role !== "ADMIN") {
            window.location.href = "index.html";
            return;
        }

        identity.textContent = `Signed in as ${me.username} (${me.role})`;

        try {
            await Promise.all([loadUsers(), loadCoins(), loadAuditTrail()]);
        } catch (error) {
            handleError(error);
        }
    }

    initializePage();
</script>
</body>
</html>
