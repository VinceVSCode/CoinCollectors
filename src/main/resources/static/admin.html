<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker - Admin</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
<div class="section topbar">
    <div class="brand">
        <span class="coin-mark">CT</span>
        <h1>Coin Tracker &middot; Admin</h1>
    </div>
    <div class="row" style="margin-bottom: 0;">
        <span class="identity" id="identity"></span>
        <a href="index.html">My collection</a>
        <button id="logoutButton">Log out</button>
    </div>
</div>

<div class="section">
    <h2>Users</h2>
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
    const identity = document.getElementById("identity");
    const usersTableBody = document.getElementById("usersTableBody");

    document.getElementById("logoutButton").addEventListener("click", () => CoinAuth.logout());

    function handleError(error) {
        if (error.status === 401) {
            CoinAuth.redirectToLogin();
            return;
        }
        CoinUI.error(error.message);
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value);
        return div.innerHTML;
    }

    async function loadUsers() {
        const users = await CoinAuth.fetchJson("/api/admin/users");
        usersTableBody.innerHTML = "";

        users.forEach(user => {
            // Only USER<->ADMIN toggle offered (no role picker) since those are the only two
            // UserRole values. No client-side check preventing an admin from demoting/
            // deactivating themselves or the last remaining admin — that guard lives entirely
            // server-side in UserManagementService, which rejects the request with a 400 if
            // it would strand the app with zero active admins. The confirm() dialogs below are
            // just a UX guardrail against misclicks, not a security control.
            const nextRole = user.role === "ADMIN" ? "USER" : "ADMIN";
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${user.userId}</td>
                <td>${escapeHtml(user.username)}</td>
                <td><span class="badge ${user.role === "ADMIN" ? "badge-admin" : "badge-user"}">${user.role}</span></td>
                <td><span class="badge ${user.active ? "badge-owned" : "badge-inactive"}">${user.active ? "Active" : "Inactive"}</span></td>
                <td>
                    <button data-action="role" data-id="${user.userId}" data-value="${nextRole}">Make ${nextRole}</button>
                    <button class="danger" data-action="active" data-id="${user.userId}" data-value="${!user.active}">${user.active ? "Deactivate" : "Activate"}</button>
                </td>
            `;

            row.querySelector('[data-action="role"]')
                .addEventListener("click", () => {
                    if (nextRole === "USER" && !confirm(`Demote "${user.username}" from ADMIN to USER?`)) {
                        return;
                    }
                    updateRole(user.userId, nextRole);
                });
            row.querySelector('[data-action="active"]')
                .addEventListener("click", () => {
                    if (user.active && !confirm(`Deactivate "${user.username}"? They will be signed out on their next request.`)) {
                        return;
                    }
                    updateActive(user.userId, !user.active);
                });

            usersTableBody.appendChild(row);
        });
    }

    async function updateRole(userId, role) {
        try {
            await CoinAuth.fetchJson(`/api/admin/users/${userId}/role`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ role })
            });
            CoinUI.success(`Updated role for user ${userId} to ${role}.`);
            await loadUsers();
        } catch (error) {
            handleError(error);
        }
    }

    async function updateActive(userId, active) {
        try {
            await CoinAuth.fetchJson(`/api/admin/users/${userId}/active`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ active })
            });
            CoinUI.success(`${active ? "Activated" : "Deactivated"} user ${userId}.`);
            await loadUsers();
        } catch (error) {
            handleError(error);
        }
    }

    async function initializePage() {
        let me;
        try {
            me = await CoinAuth.getMe();
        } catch (error) {
            CoinAuth.redirectToLogin();
            return;
        }

        // Client-side gate only, same as index.html's admin-link toggle — the server's
        // class-level @PreAuthorize("hasRole('ADMIN')") on AdminUserController is what
        // actually stops a non-admin from calling these endpoints directly.
        if (me.role !== "ADMIN") {
            window.location.href = "index.html";
            return;
        }

        identity.textContent = `Signed in as ${me.username} (${me.role})`;

        try {
            await loadUsers();
        } catch (error) {
            handleError(error);
        }
    }

    initializePage();
</script>
</body>
</html>
