<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker - Register</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="section auth-card">
    <h1>Coin Tracker</h1>
    <h2>Create account</h2>
    <form id="registerForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Password (min 8 characters)</label>
            <input type="password" id="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit">Register</button>
    </form>
    <div id="status" class="status"></div>
    <div class="auth-links">
        Already have an account? <a href="login.html">Log in</a>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    const form = document.getElementById("registerForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Creating account...";
        status.className = "status";

        try {
            await CoinAuth.fetchJson("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            status.textContent = "Account created. Redirecting to login...";
            status.className = "status success";
            setTimeout(() => { window.location.href = "login.html"; }, 900);
        } catch (error) {
            status.textContent = error.message;
            status.className = "status error";
        }
    });
</script>
</body>
</html>
