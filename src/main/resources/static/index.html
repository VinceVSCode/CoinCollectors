<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="section topbar">
    <h1>Coin Tracker</h1>
    <div class="row" style="margin-bottom: 0;">
        <span class="identity" id="identity"></span>
        <button id="logoutButton">Log out</button>
    </div>
</div>

<div class="section">
    <h2>Progress</h2>
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">No data yet.</div>
</div>

<div class="section">
    <h2>Coin Catalog</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Country</th>
            <th>Denomination</th>
            <th>Year</th>
            <th>Set Quantity</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="catalogTableBody"></tbody>
    </table>
    <div id="catalogStatus" class="status"></div>
</div>

<div class="section">
    <h2>Owned Coins</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Country</th>
            <th>Denomination</th>
            <th>Year</th>
            <th>Quantity</th>
        </tr>
        </thead>
        <tbody id="ownedTableBody"></tbody>
    </table>
</div>

<div class="section">
    <h2>Missing Coins</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Country</th>
            <th>Denomination</th>
            <th>Year</th>
        </tr>
        </thead>
        <tbody id="missingTableBody"></tbody>
    </table>
</div>

<script src="js/auth.js"></script>
<script>
    const identity = document.getElementById("identity");
    const logoutButton = document.getElementById("logoutButton");
    const catalogTableBody = document.getElementById("catalogTableBody");
    const ownedTableBody = document.getElementById("ownedTableBody");
    const missingTableBody = document.getElementById("missingTableBody");
    const catalogStatus = document.getElementById("catalogStatus");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");

    let currentUserId = null;

    // Owned quantities keyed by coinId, used to pre-fill the catalog inputs.
    let ownedQuantities = {};

    function handleError(error, statusElement) {
        if (error.status === 401) {
            CoinAuth.redirectToLogin();
            return;
        }
        if (statusElement) {
            statusElement.textContent = error.message;
            statusElement.className = "status error";
        }
    }

    async function loadCatalog() {
        catalogStatus.textContent = "Loading catalog...";
        catalogStatus.className = "status";

        const coins = await CoinAuth.fetchJson("/api/coins");
        catalogTableBody.innerHTML = "";

        coins.forEach(coin => {
            const row = document.createElement("tr");
            const currentQuantity = ownedQuantities[coin.coinId] || 0;

            row.innerHTML = `
                <td>${coin.coinId}</td>
                <td>${coin.country}</td>
                <td>${coin.denomination}</td>
                <td>${coin.year}</td>
                <td>
                    <input type="number" min="0" value="${currentQuantity}" class="small-input" id="quantity-${coin.coinId}">
                </td>
                <td>
                    <button data-coin-id="${coin.coinId}">Save</button>
                </td>
            `;

            row.querySelector("button").addEventListener("click", () => updateQuantity(coin.coinId));
            catalogTableBody.appendChild(row);
        });

        catalogStatus.textContent = "Catalog loaded.";
        catalogStatus.className = "status success";
    }

    async function loadOwnedCoins() {
        const ownedCoins = await CoinAuth.fetchJson(`/api/users/${currentUserId}/owned-coins`);

        ownedQuantities = {};
        ownedTableBody.innerHTML = "";

        ownedCoins.forEach(coin => {
            ownedQuantities[coin.coinId] = coin.quantity;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${coin.coinId}</td>
                <td>${coin.country}</td>
                <td>${coin.denomination}</td>
                <td>${coin.year}</td>
                <td>${coin.quantity}</td>
            `;
            ownedTableBody.appendChild(row);
        });

        return ownedCoins.length;
    }

    async function loadMissingCoins() {
        const missingCoins = await CoinAuth.fetchJson(`/api/users/${currentUserId}/missing-coins`);

        missingTableBody.innerHTML = "";

        missingCoins.forEach(coin => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${coin.coinId}</td>
                <td>${coin.country}</td>
                <td>${coin.denomination}</td>
                <td>${coin.year}</td>
            `;
            missingTableBody.appendChild(row);
        });

        return missingCoins.length;
    }

    async function loadProgress() {
        const progress = await CoinAuth.fetchJson(`/api/users/${currentUserId}/progress`);

        progressFill.style.width = progress.percentageComplete + "%";
        progressLabel.textContent = progress.totalCoinsInCatalog > 0
            ? `${progress.ownedCoinCount} of ${progress.totalCoinsInCatalog} coins collected (${progress.percentageComplete}%).`
            : "No coins in the catalog yet.";
    }

    async function loadCollection() {
        await Promise.all([
            loadOwnedCoins(),
            loadMissingCoins(),
            loadProgress()
        ]);
    }

    async function updateQuantity(coinId) {
        const input = document.getElementById(`quantity-${coinId}`);
        const quantity = Number(input.value);

        catalogStatus.textContent = "Saving quantity...";
        catalogStatus.className = "status";

        try {
            await CoinAuth.fetchJson(`/api/users/${currentUserId}/collection/${coinId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quantity })
            });

            catalogStatus.textContent = `Saved quantity ${quantity} for coin ${coinId}.`;
            catalogStatus.className = "status success";

            await loadCollection();
        } catch (error) {
            handleError(error, catalogStatus);
        }
    }

    logoutButton.addEventListener("click", () => CoinAuth.logout());

    async function initializePage() {
        let me;
        try {
            me = await CoinAuth.getMe();
        } catch (error) {
            CoinAuth.redirectToLogin();
            return;
        }

        currentUserId = me.userId;
        identity.textContent = `Signed in as ${me.username} (${me.role})`;

        try {
            await loadCollection();
            await loadCatalog();
        } catch (error) {
            handleError(error, catalogStatus);
        }
    }

    initializePage();
</script>
</body>
</html>
