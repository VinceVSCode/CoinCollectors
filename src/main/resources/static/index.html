<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tracker</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
<div class="section topbar">
    <div class="brand">
        <span class="coin-mark">CT</span>
        <h1>Coin Tracker</h1>
    </div>
    <div class="row" style="margin-bottom: 0;">
        <span class="identity" id="identity"></span>
        <a href="admin.html" id="adminLink" style="display: none;">Admin</a>
        <button id="logoutButton">Log out</button>
    </div>
</div>

<div class="section">
    <h2>Progress</h2>
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">No data yet.</div>
</div>

<div class="section">
    <h2>Coins</h2>
    <div class="filter-bar">
        <input type="search" id="searchInput" placeholder="Search by country or denomination...">
        <div class="filter-tabs">
            <button type="button" class="active" data-filter="all">All</button>
            <button type="button" data-filter="owned">Owned</button>
            <button type="button" data-filter="missing">Missing</button>
        </div>
        <button type="button" id="exportButton">Export CSV</button>
    </div>
    <div class="table-scroll">
        <table>
            <thead>
            <tr>
                <th><button type="button" class="sort-header" data-sort="country">Country<span class="sort-arrow"></span></button></th>
                <th><button type="button" class="sort-header" data-sort="denomination">Denomination<span class="sort-arrow"></span></button></th>
                <th><button type="button" class="sort-header" data-sort="year">Year<span class="sort-arrow"></span></button></th>
                <th><button type="button" class="sort-header" data-sort="status">Status<span class="sort-arrow"></span></button></th>
                <th><button type="button" class="sort-header" data-sort="quantity">Quantity<span class="sort-arrow"></span></button></th>
                <th></th>
            </tr>
            </thead>
            <tbody id="coinsTableBody"></tbody>
        </table>
    </div>
    <div id="emptyState" class="empty-state" style="display: none;">No coins match your search.</div>
</div>

<div class="section">
    <h2>Change Password</h2>
    <form id="passwordForm" class="filter-bar">
        <input type="password" id="currentPassword" placeholder="Current password"
               autocomplete="current-password" required>
        <input type="password" id="newPassword" placeholder="New password (min 8 characters)"
               autocomplete="new-password" minlength="8" required>
        <button type="submit" class="primary" id="passwordSubmitButton">Update password</button>
    </form>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
    const identity = document.getElementById("identity");
    const logoutButton = document.getElementById("logoutButton");
    const coinsTableBody = document.getElementById("coinsTableBody");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const searchInput = document.getElementById("searchInput");
    const filterTabs = document.querySelectorAll(".filter-tabs button");
    const sortHeaders = document.querySelectorAll(".sort-header");
    const exportButton = document.getElementById("exportButton");
    const passwordForm = document.getElementById("passwordForm");
    const currentPasswordInput = document.getElementById("currentPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const passwordSubmitButton = document.getElementById("passwordSubmitButton");
    const emptyState = document.getElementById("emptyState");

    let currentUserId = null;

    // Owned quantities keyed by coinId, used to pre-fill quantity inputs and to derive each
    // row's owned/missing status client-side (a quantity of 0 counts as "not owned" — see
    // PostgresCollectionEntryRepository — so status is quantity > 0, not just "has a row").
    let ownedQuantities = {};
    let catalogCoins = [];
    let activeFilter = "all";

    // null = no explicit sort, i.e. keep the catalog's own order as returned by /api/coins.
    let sortKey = null;
    let sortAscending = true;

    // Central error handler for every fetch on this page: a 401 means AccountStatusFilter or
    // session expiry just invalidated us mid-use, so bounce to login rather than showing a
    // confusing in-page error; anything else surfaces as an error toast.
    function handleError(error) {
        if (error.status === 401) {
            CoinAuth.redirectToLogin();
            return;
        }
        CoinUI.error(error.message);
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value);
        return div.innerHTML;
    }

    function matchesFilter(coin, quantity) {
        if (activeFilter === "owned") return quantity > 0;
        if (activeFilter === "missing") return quantity === 0;
        return true;
    }

    function matchesSearch(coin, term) {
        if (!term) return true;
        const haystack = `${coin.country} ${coin.denomination}`.toLowerCase();
        return haystack.includes(term);
    }

    // The value a row is sorted by for a given column. Status and quantity both derive from
    // ownedQuantities rather than the coin itself, so they can't be read straight off `coin`.
    function sortValue(coin, key) {
        const quantity = ownedQuantities[coin.coinId] || 0;
        if (key === "quantity") return quantity;
        if (key === "status") return quantity > 0 ? 1 : 0;
        if (key === "year") return coin.year;
        return String(coin[key] || "").toLowerCase();
    }

    function compareCoins(a, b) {
        const left = sortValue(a, sortKey);
        const right = sortValue(b, sortKey);
        let result;
        if (typeof left === "number" && typeof right === "number") {
            result = left - right;
        } else {
            result = String(left).localeCompare(String(right));
        }
        // Fall back to coinId so equal values (e.g. two Missing rows) keep a stable, predictable
        // order instead of depending on the engine's sort stability.
        if (result === 0) {
            result = a.coinId - b.coinId;
        }
        return sortAscending ? result : -result;
    }

    function updateSortIndicators() {
        sortHeaders.forEach(header => {
            const isActive = header.dataset.sort === sortKey;
            header.classList.toggle("active", isActive);
            header.querySelector(".sort-arrow").textContent = isActive ? (sortAscending ? "▲" : "▼") : "";
        });
    }

    // Rebuilds the table body from scratch on every call: filter + search decide which coins
    // appear, the active sort decides their order. Cheap at this app's scale (one page of
    // catalog coins) and avoids keeping a second copy of row state in sync with the data.
    function renderCoins() {
        const term = searchInput.value.trim().toLowerCase();
        coinsTableBody.innerHTML = "";
        let visibleCount = 0;

        const coins = sortKey ? [...catalogCoins].sort(compareCoins) : catalogCoins;

        coins.forEach(coin => {
            const quantity = ownedQuantities[coin.coinId] || 0;
            if (!matchesFilter(coin, quantity) || !matchesSearch(coin, term)) {
                return;
            }
            visibleCount++;

            const row = document.createElement("tr");
            const isOwned = quantity > 0;
            row.innerHTML = `
                <td>${escapeHtml(coin.country)}</td>
                <td>${escapeHtml(coin.denomination)}</td>
                <td>${coin.year}</td>
                <td><span class="badge ${isOwned ? "badge-owned" : "badge-missing"}">${isOwned ? "Owned" : "Missing"}</span></td>
                <td>
                    <input type="number" min="0" value="${quantity}" class="small-input" id="quantity-${coin.coinId}">
                </td>
                <td>
                    <button data-coin-id="${coin.coinId}">Save</button>
                </td>
            `;

            row.querySelector("button").addEventListener("click", () => updateQuantity(coin.coinId));
            coinsTableBody.appendChild(row);
        });

        emptyState.style.display = visibleCount === 0 ? "" : "none";
    }

    async function loadCatalog() {
        catalogCoins = await CoinAuth.fetchJson("/api/coins");
    }

    async function loadOwnedQuantities() {
        const ownedCoins = await CoinAuth.fetchJson(`/api/users/${currentUserId}/owned-coins`);
        ownedQuantities = {};
        ownedCoins.forEach(coin => {
            ownedQuantities[coin.coinId] = coin.quantity;
        });
    }

    async function loadProgress() {
        const progress = await CoinAuth.fetchJson(`/api/users/${currentUserId}/progress`);

        progressFill.style.width = progress.percentageComplete + "%";
        progressLabel.textContent = progress.totalCoinsInCatalog > 0
            ? `${progress.ownedCoinCount} of ${progress.totalCoinsInCatalog} coins collected (${progress.percentageComplete}%).`
            : "No coins in the catalog yet.";
    }

    // Fired in parallel since catalog/owned-quantities/progress are independent reads over
    // different (or overlapping-but-read-only) data — no reason to serialize them.
    async function loadAll() {
        await Promise.all([
            loadCatalog(),
            loadOwnedQuantities(),
            loadProgress()
        ]);
        renderCoins();
    }

    async function updateQuantity(coinId) {
        const input = document.getElementById(`quantity-${coinId}`);
        const quantity = Number(input.value);

        try {
            await CoinAuth.fetchJson(`/api/users/${currentUserId}/collection/${coinId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quantity })
            });

            CoinUI.success(`Saved quantity ${quantity} for coin ${coinId}.`);

            // Re-fetch owned quantities/progress rather than patching local state in place —
            // simpler and guarantees the UI matches server truth (e.g. progress %), at the
            // cost of a couple extra requests per save. Fine at this app's scale.
            await Promise.all([loadOwnedQuantities(), loadProgress()]);
            renderCoins();
        } catch (error) {
            handleError(error);
        }
    }

    logoutButton.addEventListener("click", () => CoinAuth.logout());

    // Downloaded via fetch rather than a plain <a href> so a 401 still routes through
    // handleError() and bounces to login — a raw link would just render the JSON error body.
    async function exportCsv() {
        exportButton.disabled = true;

        try {
            const response = await fetch(`/api/users/${currentUserId}/collection/export`, {
                credentials: "same-origin"
            });

            if (!response.ok) {
                const error = new Error("Could not export the collection.");
                error.status = response.status;
                throw error;
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `collection-${currentUserId}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            // Release the blob once the download has been handed off, or the object URL leaks
            // for the lifetime of the page.
            URL.revokeObjectURL(url);

            CoinUI.success("Collection exported.");
        } catch (error) {
            handleError(error);
        } finally {
            exportButton.disabled = false;
        }
    }

    exportButton.addEventListener("click", exportCsv);

    // The session survives a password change, so there's nothing to re-authenticate here — the
    // form just clears. A wrong current password comes back as a 400, not a 401, precisely so
    // handleError doesn't mistake it for an expired session and redirect mid-form.
    async function changePassword(event) {
        event.preventDefault();
        passwordSubmitButton.disabled = true;

        try {
            await CoinAuth.fetchJson("/api/auth/password", {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    currentPassword: currentPasswordInput.value,
                    newPassword: newPasswordInput.value
                })
            });

            passwordForm.reset();
            CoinUI.success("Password updated.");
        } catch (error) {
            handleError(error);
        } finally {
            passwordSubmitButton.disabled = false;
        }
    }

    passwordForm.addEventListener("submit", changePassword);

    searchInput.addEventListener("input", renderCoins);

    filterTabs.forEach(tab => {
        tab.addEventListener("click", () => {
            filterTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            activeFilter = tab.dataset.filter;
            renderCoins();
        });
    });

    // Clicking the active column flips direction; clicking a new one sorts it ascending.
    sortHeaders.forEach(header => {
        header.addEventListener("click", () => {
            const key = header.dataset.sort;
            if (sortKey === key) {
                sortAscending = !sortAscending;
            } else {
                sortKey = key;
                sortAscending = true;
            }
            updateSortIndicators();
            renderCoins();
        });
    });

    async function initializePage() {
        // getMe() failing (401) is the normal "not logged in" case for a fresh visit — not an
        // error to surface, just a signal to redirect.
        let me;
        try {
            me = await CoinAuth.getMe();
        } catch (error) {
            CoinAuth.redirectToLogin();
            return;
        }

        currentUserId = me.userId;
        identity.textContent = `Signed in as ${me.username} (${me.role})`;

        // Client-side visibility toggle only — the actual protection is server-side
        // (@PreAuthorize on AdminUserController); this just avoids showing a link a non-admin
        // would immediately get a 403 from.
        if (me.role === "ADMIN") {
            document.getElementById("adminLink").style.display = "";
        }

        try {
            await loadAll();
        } catch (error) {
            handleError(error);
        }
    }

    initializePage();
</script>
</body>
</html>
