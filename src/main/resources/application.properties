spring.application.name=coin-tracker
server.port=8080
# Spring Boot's own Flyway auto-configuration is disabled because DatabaseBootstrap.initialize()
# already runs Flyway manually (with its own DataSource built straight from env vars) before
# the Spring context starts up — leaving Spring Boot's copy enabled would just run migrations
# a second, redundant time using the (not-yet-ready) auto-configured DataSource.
spring.flyway.enabled=false